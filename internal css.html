<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal css</title>
    <style>
        /* styling all <h1> elements */
            h1 {
                color:blue;
                text-align: center;
                text-decoration: underline;
            }

            /*styling all <p> ekements */

            p {
                color: green;
                font-size: 30px;
                line-height: 1.5;
            }

            /*styling the button */
             button {
                background-color: black;
                color: white;
                padding: 10px;
                border: none;
                border-radius: 5px;
                font-size: 16px;
             }

            /*styling the ordered list*/
             
            li {
                margin:8px;
            }
             ol {
                color: black;
                font-size: 30px;
             }

             /* styling the unordered list*/

             ul {color: blueviolet;
                font-size: 30px;
            } 
            /* styling the text formating tags*/

            i {
                color: green;
                font-size: 30px;
            }

            /* styling highlighting text */

            mark {background-color: aqua;
            }

           /*styling the table*/
           table {
            border-collapse: collapse;
            width: 40%;
           } 
           th {
               background-color: rgb(48, 48, 192);
               font-size: 20px;
               color: black;
               padding: 10px;
           }
           td {
              background-color: rgb(123, 88, 156);
              color: black;
              font-size: 20px;
              padding: 10px;
              text-align:center ;
           }
        
           
           /* styling the image*/

           img {
            width: 200px;
            border:5px solid black;
            border-radius: 10px;
           }

           /* styling links*/
           a {
            color:red;
            text-decoration: none;
            font-size:30px;
           }

           /*styling the horizontal line*/

           hr {
            border: 2px solid rgb(13, 13, 14);
           }

    </style>

</head>
<body>

<hr>
