<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline css</title>
</head>
<body>
    <h1 style="color:blue; text-align:center;">
        MY WEBSITE
    </h1>
    <!--the style is applied directly tio this paragraph-->
    <p style="color:rgb(175, 56, 76); font-size:20px;">
      This is an example of Inline css.
    </p>

    <!--another element with its own style-->
    <button style="background-color: black; color: white;">
      click me
    </button>
    
</body>
</html>
